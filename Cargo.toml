[package]
name = "docview"
version = "0.1.0"
edition = "2024"
description = "Minimal, low-memory PDF viewer for Linux"
license = "MIT"
repository = "https://github.com/ahaan-shah/docview"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
poppler = { package = "poppler-rs", version = "0.26", features = ["v25_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
async-channel = "2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[dev-dependencies]
pangocairo = "0.22"
cairo-rs = { version = "0.22", features = ["pdf", "v1_18"] }
